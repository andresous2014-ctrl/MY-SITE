<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#fafafa;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.main-container{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:350px;width:100%}
.login-box{background:#fff;border:1px solid #dbdbdb;border-radius:1px;padding:40px 40px 30px;width:100%;display:flex;flex-direction:column;align-items:center}
.logo{margin:22px auto 12px;width:175px;height:auto}
.logo svg{width:100%;height:auto}
form{width:100%;display:flex;flex-direction:column;gap:6px;margin-top:24px}
.input-group{position:relative;width:100%}
.input-group input{width:100%;padding:9px 0 7px 8px;background:#fafafa;border:1px solid #dbdbdb;border-radius:3px;font-size:12px;outline:none;transition:border 0.1s;color:#262626}
.input-group input::placeholder{color:#8e8e8e;font-size:12px}
.input-group input:focus{border-color:#a8a8a8}
.input-group label{position:absolute;left:8px;top:10px;font-size:12px;color:#8e8e8e;pointer-events:none;transition:all 0.1s ease;display:none}
.input-group.filled label{display:block;font-size:10px;top:4px;color:#8e8e8e}
.input-group.filled input{padding:14px 0 2px 8px;font-size:12px}
.btn-login{width:100%;padding:7px 16px;background:#0095f6;border:none;border-radius:8px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px;opacity:0.7;transition:opacity 0.2s;line-height:18px;min-height:32px}
.btn-login.active{opacity:1}
.btn-login:hover{background:#1877f2}
.btn-login:disabled{opacity:0.5;cursor:not-allowed}
.divider{display:flex;align-items:center;width:100%;margin:14px 0 18px;gap:18px}
.divider-line{flex:1;height:1px;background:#dbdbdb}
.divider-text{color:#737373;font-size:13px;font-weight:600;text-transform:uppercase}
.fb-login{display:flex;align-items:center;justify-content:center;gap:8px;background:none;border:none;cursor:pointer;color:#385185;font-size:14px;font-weight:600;margin-bottom:12px}
.fb-login svg{width:20px;height:20px}
.forgot-password{color:#00376b;font-size:12px;text-decoration:none;margin-top:12px}
.forgot-password:hover{text-decoration:underline}
.signup-box{background:#fff;border:1px solid #dbdbdb;border-radius:1px;padding:20px 40px;width:100%;text-align:center;font-size:14px;color:#262626}
.signup-box a{color:#0095f6;font-weight:600;text-decoration:none}
.signup-box a:hover{text-decoration:underline}
.get-app{text-align:center;margin-top:10px;width:100%}
.get-app p{font-size:14px;color:#262626;margin-bottom:20px}
.app-buttons{display:flex;justify-content:center;gap:8px}
.app-buttons img{height:40px;width:auto}
.error-msg{background:#ffebee;color:#c62828;font-size:12px;padding:10px 12px;border-radius:3px;margin-top:8px;display:none;text-align:center;line-height:1.4;width:100%}
.loader{display:none;margin:10px auto;width:20px;height:20px;border:2px solid #e0e0e0;border-top:2px solid #0095f6;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
footer{margin-top:30px;max-width:350px;width:100%;text-align:center}
footer .links{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 16px;margin-bottom:12px}
footer .links a{color:#8e8e8e;font-size:12px;text-decoration:none}
footer .links a:hover{text-decoration:underline}
footer .copyright{color:#8e8e8e;font-size:12px}
footer select{background:none;border:none;color:#8e8e8e;font-size:12px;cursor:pointer;outline:none;margin-right:4px}
</style>
</head>
